<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aura-NetGuard</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">&#9679;</span>
      <div>
        <h1>Aura-NetGuard</h1>
        <p>AI-based network failure prediction &amp; human-centred explainable alerts</p>
      </div>
    </div>
    <div id="global-stats" class="global-stats"></div>
  </header>

  <main class="layout">
    <section class="panel fleet-panel">
      <div class="panel-header">
        <h2>Fleet</h2>
        <span id="fleet-count" class="muted"></span>
      </div>
      <div id="fleet-grid" class="fleet-grid"></div>

      <div id="device-detail" class="device-detail" hidden>
        <div class="panel-header">
          <h3 id="detail-title">Device</h3>
          <button id="detail-close" class="btn-ghost">Close</button>
        </div>
        <p id="chart-fallback" class="empty-state" hidden>
          Charts unavailable — the Chart.js CDN could not be reached from this
          network. Live metrics are still being collected.
        </p>
        <div id="chart-grid" class="chart-grid">
          <canvas id="chart-latency"></canvas>
          <canvas id="chart-loss"></canvas>
          <canvas id="chart-cpu-mem"></canvas>
          <canvas id="chart-errors"></canvas>
        </div>
      </div>
    </section>

    <section class="panel alerts-panel">
      <div class="panel-header">
        <h2>Predicted failures</h2>
        <span id="alerts-count" class="muted"></span>
      </div>
      <div id="trust-panel" class="trust-panel"></div>
      <div id="alerts-feed" class="alerts-feed"></div>
    </section>
  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
